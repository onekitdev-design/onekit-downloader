services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.1
    init: true
    restart: unless-stopped
    expose:
      - "4416"
    # Keep the unauthenticated POT server off the public internet.
    networks:
      - downloader

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        YTDLP_VERSION: "2026.8.19"
        POT_PLUGIN_VERSION: "2.0.1"
    restart: unless-stopped
    depends_on:
      - pot-provider
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      POT_PROVIDER_URL: http://pot-provider:4416
      HOME: /tmp/onekit
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - download-tmp:/tmp/onekit
    networks:
      - downloader

volumes:
  download-tmp:

networks:
  downloader:
    driver: bridge
